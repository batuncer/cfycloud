name: Deploy to EC2

on:
  push:
    branches: [sprintTwo]


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the Code
        uses: actions/checkout@v4

      - name: Install SSH KEY
        run: |
          echo "${{ secrets.EC2_KEY}}" > cfy.pem
          chmod 400 cfy.pem

      - name: Connect to EC2 and install docker and run
        run: |
          ssh -o StrictHostKeyChecking=no -i cfy.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            sudo yum update -y
            sudo yum install -y docker
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker $USER
            echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            docker pull ${{ secrets.DOCKER_USERNAME }}/employee-backend:latest
            docker stop employee || true
            docker rm employee || true
            docker run -d --name employee -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/employee-backend:latest
          EOF
