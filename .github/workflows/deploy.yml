name: Deploy to EC2

on:
  push:
    branches: [sprintTwo]

env:
  IMAGE_NAME: ${{secrets.DOCKER_USERNAME}}/employee-backend
  DB_HOST: ${{secrets.DB_HOST}}
  DB_NAME: ${{secrets.DB_NAME}}
  DB_USER: ${{secrets.DB_USER}}
  DB_PASSWORD: ${{secrets.DB_PASSWORD}}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the Code
        uses: actions/checkout@v4

      - name: Install SSH KEY
        run: |
          echo "${{ secrets.EC2_KEY}}" > cfy.pem
          chmod 400 cfy.pem

      - name: Connect to EC2 and install docker and run
        run: |
          ssh -o StrictHostKeyChecking=no -i cfy.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            sudo yum update -y
            sudo yum install -y docker
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -a -G docker ec2-user
            echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            docker pull ${{ secrets.DOCKER_USERNAME }}/employee-backend:latest
            docker stop employee || true
            docker rm employee || true
            docker run -d --name employee -e DB_HOST=${{env.DB_HOST}} -e DB_USER=${{env.DB_USER}} -e DB_PASSWORD=${{env.DB_PASSWORD}} -e DB_NAME=${{env.DB_PASSWORD}} -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/employee-backend:latest
          EOF
