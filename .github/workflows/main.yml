name: Basic CI/CD Pipeline

on:
  push:
    branches: [ sprintOne ]

env:
  IMAGE_NAME: ${{secrets.DOCKER_USERNAME}}/employee-backend
  DB_HOST: ${{secrets.DB_HOST}}
  DB_NAME: ${{secrets.DB_NAME}}
  DB_USER: ${{secrets.DB_USER}}
  DB_PASSWORD: ${{secrets.DB_PASSWORD}}
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify

      - name: Upload Java Artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-backend-jar
          path: target/*.jar

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}/employee-backend:latest .
          docker push ${{ env.IMAGE_NAME }}/employee-backend:latest

